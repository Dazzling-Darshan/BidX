services:
  # Backend API & WebSocket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bidx-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - ORIGIN=http://localhost:5173
    networks:
      - bidx-network

  # Frontend React SPA served via Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API: http://localhost:4000/api
        VITE_SOCKET_URL: http://localhost:4000
    container_name: bidx-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - bidx-network

networks:
  bidx-network:
    driver: bridge
