<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="gold" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  
  <!-- Subtle Highlight Sheen -->
  <rect width="64" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Centered Gavel & Dynamic X Vector Icon -->
  <g transform="translate(8, 8) scale(1.5)">
    <!-- Gavel Head -->
    <rect
      x="9"
      y="7"
      width="14"
      height="5.5"
      rx="2"
      transform="rotate(-40 9 7)"
      fill="#FFFFFF"
      fill-opacity="0.95"
    />
    <!-- Gavel handle slash -->
    <path
      d="M13.5 13.5L24 24"
      stroke="#FFFFFF"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Counter-crossing stroke completing the 'X' with Gold accent -->
    <path
      d="M24 10.5L9.5 25"
      stroke="url(#gold)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Base impact block -->
    <rect
      x="5.5"
      y="24.5"
      width="8"
      height="2.5"
      rx="1.25"
      fill="#FFFFFF"
      fill-opacity="0.8"
    />
  </g>
</svg>
