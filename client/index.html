<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Auction - Real-time Bidding Platform</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="http://localhost:5173" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Online Auction System is a real-time bidding platform built using the MERN stack. It allows users to bid and win products online."
    />
    <meta
      name="keywords"
      content="online auction system, MERN stack project, major project, minor project, online bidding platform, real-time auction system, computer science final year project, buy and sell system, react node project"
    />
    <meta name="author" content="" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph for Social Sharing -->
    <meta
      property="og:title"
      content="Online Auction System - MERN Stack Project"
    />
    <meta
      property="og:description"
      content="A MERN stack project that allows users to bid on items in real-time."
    />
    <meta
      property="og:image"
      content="/screenshots/landingpage.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="http://localhost:5173" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Online Auction" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Online Auction System - MERN Stack Project"
    />
    <meta
      name="twitter:description"
      content="An online bidding project using MongoDB, Express, React, and Node. Great for major or minor project submission."
    />
    <meta
      name="twitter:image"
      content="/screenshots/landingpage.png"
    />

    <!-- AdSense script -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9347518247329906"
      crossorigin="anonymous"
    ></script>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Online Auction",
        "url": "http://localhost:5173",
        "description": "Real-time online bidding platform built with the MERN stack. Create auctions, place bids, and win items.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "http://localhost:5173/auction?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
